plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def youtubeApiKey = (project.findProperty('YOUTUBE_API_KEY') ?: System.getenv('YOUTUBE_API_KEY') ?: '').toString()
android {
    namespace 'com.robotai.robot'
    compileSdk 34
    defaultConfig {
        applicationId 'com.robotai.robot'
        ndk { abiFilters 'arm64-v8a' }
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '0.2-companion-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'YOUTUBE_API_KEY', '"' + youtubeApiKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
    androidResources { noCompress += ['onnx', 'tflite', 'task'] }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.0' }
}
dependencies {
    implementation project(':domain')
    implementation files('../../whisper-test/app/libs/onnxruntime-android-1.24.3-tts.aar')
    implementation files('../../whisper-test/app/libs/sherpa-onnx-1.13.8.aar')
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.compose.material3:material3:1.1.1'
    implementation 'androidx.compose.ui:ui:1.5.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.2'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.5.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.5.0'
}
